<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C7A5E">
<title>MonAgric</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <img src="img/icon-192.png" alt="" class="topbar-logo">
  <div class="topbar-title">
    <h1>MonAgric</h1>
    <span id="estado-sync" class="estado-sync">Cargando…</span>
  </div>
  <button id="btn-ajustes" class="topbar-btn" title="Ajustes" aria-label="Ajustes">&#9881;</button>
</header>

<main id="vista"></main>

<nav class="tabs">
  <button data-vista="inicio" class="tab activa"><span class="tab-icono">&#9737;</span>Inicio</button>
  <button data-vista="siembras" class="tab"><span class="tab-icono">&#127793;</span>Siembras</button>
  <button data-vista="horas" class="tab"><span class="tab-icono">&#9201;</span>Horas</button>
  <button data-vista="cosechas" class="tab"><span class="tab-icono">&#127807;</span>Cosechas</button>
  <button data-vista="plan" class="tab"><span class="tab-icono">&#9776;</span>Plan</button>
</nav>

<div id="aviso" class="aviso oculto"></div>

<script src="app.js"></script>
</body>
</html>
